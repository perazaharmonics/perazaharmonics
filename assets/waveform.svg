<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Waveform banner">
  <defs>
    <linearGradient id="g" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#C77DFF;#00FFFF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#C77DFF">
        <animate attributeName="stop-color" values="#C77DFF;#00FFFF;#C77DFF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <path d="M0 70 H1200" stroke="#4B4B4B" stroke-dasharray="4 6" opacity="0.25"/>
  <path d="M0 35 H1200 M0 105 H1200" stroke="#333333" stroke-dasharray="2 10" opacity="0.25"/>

  <path id="wf" d="M0,70 C60,30 120,110 180,70 S300,30 360,70 S540,110 600,70 S780,30 840,70 S1020,110 1080,70 S1140,50 1200,70"/>

  <use href="#wf" fill="none" stroke="url(#g)" stroke-width="8" stroke-linecap="round" filter="url(#glow)" opacity="0.18">
    <animate attributeName="opacity" values="0.18;0.10;0.18" dur="3s" repeatCount="indefinite"/>
  </use>

  <use href="#wf" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" stroke-opacity="0.9">
    <animate attributeName="stroke-opacity" values="0.9;0.5;0.9" dur="2.8s" repeatCount="indefinite"/>
  </use>
</svg>